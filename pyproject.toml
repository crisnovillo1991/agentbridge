[project]
name = "agentbridge"
version = "0.1.0"
description = "Paywall + protocol bridge for agent capabilities: MCP in, x402-metered endpoint out, signed receipt for every call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
