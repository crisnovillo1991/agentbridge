services:
  bridge:
    build: .
    ports:
      - "8402:8402"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      CAPABILITIES_FILE: /app/capabilities.yaml
    volumes:
      - ./data:/app/data
      - ./capabilities.yaml:/app/capabilities.yaml:ro
    restart: unless-stopped

  # v0 stores receipt blobs on the local volume above. When volume grows,
  # point the store at MinIO (S3 API) — interface already isolated in
  # receipts/store.py. Uncomment to have it ready:
